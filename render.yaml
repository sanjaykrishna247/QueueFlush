# Render Blueprint — deploys the FastAPI backend.
# Render dashboard → New → Blueprint → pick this repo.
services:
  - type: web
    name: queueflush-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.4
      - key: PYTHONIOENCODING
        value: utf-8
      # Your Vercel URL, e.g. https://queueflush.vercel.app (comma-separate several)
      - key: CORS_ORIGINS
        sync: false
      # Optional: allow Vercel preview deploys of this project
      - key: CORS_ORIGIN_REGEX
        value: https://queueflush.*\.vercel\.app
